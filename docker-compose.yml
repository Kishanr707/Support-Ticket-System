# docker-compose.yml
#
# Backend service for the Support Ticket System.
# The SQLite database is mounted from the host machine so
# ticket data persists even when the Docker container is recreated.
#
# Local database:
#   ./tickets.db
#
# Database inside container:
#   /app/tickets.db

version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ticket-priority-backend

    ports:
      - "8000:8000"

    volumes:
      - ./tickets.db:/app/tickets.db

